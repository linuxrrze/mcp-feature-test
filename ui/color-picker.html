<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colour picker</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-primary, #ffffff);
    --panel: var(--color-background-secondary, #f4f5f7);
    --fg: var(--color-text-primary, #1c1e21);
    --muted: var(--color-text-secondary, #6b6f76);
    --border: var(--color-border-primary, #d9dce1);
    --accent: #4f46e5;
    --accent-fg: #ffffff;
    --ok: #15803d;
    --err: #b91c1c;
    --radius: var(--border-radius-md, 10px);
    --font: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif);
    --mono: var(--font-mono, ui-monospace, Menlo, monospace);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--color-background-primary, #1b1c1f); --panel: var(--color-background-secondary, #25262b);
      --fg: var(--color-text-primary, #ececef); --muted: var(--color-text-secondary, #9c9ea6);
      --border: var(--color-border-primary, #3a3b41); --accent: #8b85ff; --accent-fg: #111;
      --ok: #4ade80; --err: #f87171;
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #1b1c1f); --panel: var(--color-background-secondary, #25262b);
    --fg: var(--color-text-primary, #ececef); --muted: var(--color-text-secondary, #9c9ea6);
    --border: var(--color-border-primary, #3a3b41); --accent: #8b85ff; --accent-fg: #111;
    --ok: #4ade80; --err: #f87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font); }
  main { padding: 14px 16px; max-width: 520px; }
  h1 { font-size: 16px; margin: 0 0 10px; overflow-wrap: anywhere; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  input[type=color] { width: 48px; height: 38px; border: none; background: none; padding: 0; cursor: pointer; }
  input[type=text] { width: 110px; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); font: 14px var(--mono); }
  input[type=text][aria-invalid=true] { border-color: var(--err); outline-color: var(--err); }
  .preview { flex: 1; min-width: 80px; height: 38px; border-radius: 8px; border: 1px solid var(--border); }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .presets button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; padding: 0; }
  .presets button[aria-pressed=true] { border-color: var(--fg); }
  label.tell { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .btn { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--fg); font: inherit; font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .btn:disabled, input:disabled { opacity: .5; cursor: default; }
  #status { margin-top: 8px; min-height: 18px; font-size: 13px; }
  #status.ok { color: var(--ok); } #status.err { color: var(--err); }
  ul.report { list-style: none; margin: 6px 0 0; padding: 0; font-size: 12px; color: var(--muted); }
  ul.report li[hidden] { display: none; }
  ul.report li[data-state=ok] b { color: var(--ok); }
  ul.report li[data-state=err] b { color: var(--err); }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  pre { font: 11px/1.4 var(--mono); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px; overflow: auto; max-height: 200px; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <h1 id="prompt">Pick a colour</h1>
  <div class="row">
    <input id="color" type="color" value="#4f46e5" aria-label="Colour">
    <input id="hex" type="text" value="#4f46e5" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Hex colour (#rrggbb)">
    <div id="preview" class="preview" role="img" aria-label="Preview"></div>
  </div>
  <div class="presets" id="presets" aria-label="Presets"></div>
  <label class="tell"><input id="tell" type="checkbox" checked> Also tell the assistant in the chat (ui/message)</label>
  <div class="actions">
    <button class="btn primary" id="ok" type="button" disabled>OK</button>
    <button class="btn" id="cancel" type="button" disabled>Cancel</button>
  </div>
  <div id="status" role="status">Waiting for the tool result…</div>
  <ul class="report" id="report" hidden>
    <li id="r-server" data-state="">Server (pick_color_submit): <b>…</b></li>
    <li id="r-context" data-state="">Model context (ui/update-model-context): <b>…</b></li>
    <li id="r-message" data-state="">Chat message (ui/message): <b>…</b></li>
  </ul>
  <details>
    <summary>Details (for testing)</summary>
    <pre id="debug">connecting…</pre>
  </details>
</main>
<!--APP_SCRIPT-->
</body>
</html>
