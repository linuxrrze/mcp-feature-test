<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D viewer</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-primary, #ffffff);
    --panel: var(--color-background-secondary, #f4f5f7);
    --fg: var(--color-text-primary, #1c1e21);
    --muted: var(--color-text-secondary, #6b6f76);
    --border: var(--color-border-primary, #d9dce1);
    --stage: #eef1f5;
    --grid: #b8c0cc;
    --accent: #4f46e5;
    --accent-fg: #ffffff;
    --ok: #15803d;
    --err: #b91c1c;
    --font: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif);
    --mono: var(--font-mono, ui-monospace, Menlo, monospace);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--color-background-primary, #1b1c1f); --panel: var(--color-background-secondary, #25262b);
      --fg: var(--color-text-primary, #ececef); --muted: var(--color-text-secondary, #9c9ea6);
      --border: var(--color-border-primary, #3a3b41); --stage: #15171c; --grid: #3c4250;
      --accent: #8b85ff; --accent-fg: #111; --ok: #4ade80; --err: #f87171;
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #1b1c1f); --panel: var(--color-background-secondary, #25262b);
    --fg: var(--color-text-primary, #ececef); --muted: var(--color-text-secondary, #9c9ea6);
    --border: var(--color-border-primary, #3a3b41); --stage: #15171c; --grid: #3c4250;
    --accent: #8b85ff; --accent-fg: #111; --ok: #4ade80; --err: #f87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font); }
  main { padding: 12px 14px; }
  header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  h1 { font-size: 16px; margin: 0; }
  #shapeLabel { color: var(--muted); font-size: 13px; }
  #stage { position: relative; width: 100%; height: clamp(240px, 58vw, 460px); border-radius: 10px; overflow: hidden;
           border: 1px solid var(--border); background: var(--stage); outline: none; touch-action: none; }
  #stage:focus-visible { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
  body.fullscreen #stage { height: calc(100vh - 190px); min-height: 240px; }
  #stage canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  #stage canvas:active { cursor: grabbing; }
  #overlay { position: absolute; inset: auto 8px 8px 8px; font-size: 12px; color: var(--muted); pointer-events: none; text-align: right; }
  #error { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: var(--err); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 4px; }
  .btn { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--fg); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn[aria-pressed=true] { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .btn:disabled { opacity: .5; cursor: default; }
  .note { color: var(--muted); font-size: 12px; }
  #parts { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  #parts button { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); font: 12px var(--font); cursor: pointer; }
  #parts button[aria-pressed=true] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--bg)); font-weight: 600; }
  #status { min-height: 18px; font-size: 13px; }
  #status.ok { color: var(--ok); } #status.err { color: var(--err); }
  ul.report { list-style: none; margin: 4px 0 0; padding: 0; font-size: 12px; color: var(--muted); }
  ul.report li[hidden] { display: none; }
  ul.report li[data-state=ok] b { color: var(--ok); }
  ul.report li[data-state=err] b { color: var(--err); }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  table.probe { border-collapse: collapse; font-size: 12px; margin: 6px 0; width: 100%; }
  table.probe td { border-top: 1px solid var(--border); padding: 3px 6px; vertical-align: top; overflow-wrap: anywhere; }
  table.probe td:first-child { color: var(--muted); white-space: nowrap; width: 1%; }
  pre { font: 11px/1.4 var(--mono); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px; overflow: auto; max-height: 200px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .kbd { font-family: var(--mono); font-size: 11px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>3D viewer</h1>
    <span id="shapeLabel">Waiting for the tool input…</span>
  </header>
  <div id="stage" tabindex="0" role="application" aria-label="3D view. Drag or use the arrow keys to rotate, wheel or + and - to zoom, click a part to select it.">
    <div id="overlay"></div>
  </div>
  <div class="toolbar">
    <button class="btn" id="reset" type="button">Reset view</button>
    <button class="btn" id="rotate" type="button" aria-pressed="false">Auto-rotate</button>
    <button class="btn" id="wireframe" type="button" aria-pressed="false">Wireframe</button>
    <button class="btn" id="fullscreen" type="button" hidden>Fullscreen</button>
    <span class="note" id="fsNote"></span>
  </div>
  <div class="note">Drag to rotate, right-drag to pan, wheel to zoom; arrow keys orbit, <span class="kbd">+</span> / <span class="kbd">-</span> zoom. Click a part to select it.</div>
  <div id="parts" aria-label="Parts"></div>
  <div class="toolbar">
    <button class="btn primary" id="tell" type="button" disabled>Tell the assistant</button>
    <span id="status" role="status"></span>
  </div>
  <ul class="report" id="report" hidden>
    <li id="r-server" data-state="">Server (view_3d_select): <b>…</b></li>
    <li id="r-context" data-state="">Model context (ui/update-model-context): <b>…</b></li>
    <li id="r-message" data-state="" hidden>Chat message (ui/message): <b>…</b></li>
  </ul>
  <details id="details">
    <summary>Details (for testing)</summary>
    <table class="probe" id="probe"></table>
    <pre id="debug">connecting…</pre>
  </details>
</main>
<!--APP_SCRIPT-->
</body>
</html>
